<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradSam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#1c2541"/>
    </linearGradient>
    <linearGradient id="samBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="samGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f5af0"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <filter id="glowSam">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#bgGradSam)"/>
  <circle cx="200" cy="150" r="110" fill="#7f5af0" opacity="0.08" filter="url(#glowSam)"/>

  <!-- Samsung Galaxy S24 Ultra Sharp Edged Case -->
  <g transform="translate(130, 25)">
    <rect x="0" y="0" width="140" height="250" rx="10" fill="url(#samBody)" stroke="url(#samGlow)" stroke-width="3.5" filter="url(#glowSam)"/>
    <rect x="8" y="8" width="124" height="234" rx="6" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>
    
    <!-- Vertical Camera Cutouts (5 Lenses) -->
    <g transform="translate(20, 20)">
      <circle cx="15" cy="15" r="11" fill="#0b0f19" stroke="#7f5af0" stroke-width="2"/>
      <circle cx="15" cy="15" r="5" fill="#00f2fe"/>

      <circle cx="15" cy="45" r="11" fill="#0b0f19" stroke="#7f5af0" stroke-width="2"/>
      <circle cx="15" cy="45" r="5" fill="#00f2fe"/>

      <circle cx="15" cy="75" r="11" fill="#0b0f19" stroke="#7f5af0" stroke-width="2"/>
      <circle cx="15" cy="75" r="5" fill="#00f2fe"/>

      <circle cx="45" cy="25" r="7" fill="#0b0f19" stroke="#00f2fe" stroke-width="1.5"/>
      <circle cx="45" cy="25" r="3" fill="#7f5af0"/>

      <circle cx="45" cy="55" r="7" fill="#0b0f19" stroke="#00f2fe" stroke-width="1.5"/>
      <circle cx="45" cy="55" r="3" fill="#7f5af0"/>
    </g>

    <!-- Armor Hexagon Texture -->
    <path d="M 70 130 L 90 142 L 90 166 L 70 178 L 50 166 L 50 142 Z" fill="none" stroke="url(#samGlow)" stroke-width="2"/>
    <circle cx="70" cy="154" r="6" fill="#00f2fe"/>
  </g>
</svg>
