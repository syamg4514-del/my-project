<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#1c2541"/>
    </linearGradient>
    <linearGradient id="headmat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="purpleGlowH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f5af0"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <filter id="glowH">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#bgGradH)"/>
  <circle cx="200" cy="150" r="110" fill="#7f5af0" opacity="0.08" filter="url(#glowH)"/>

  <!-- Headphones Band & Earcups -->
  <g transform="translate(100, 45)">
    <!-- Headband Arc -->
    <path d="M 20 120 A 80 80 0 0 1 180 120" fill="none" stroke="url(#purpleGlowH)" stroke-width="12" stroke-linecap="round" filter="url(#glowH)"/>
    <path d="M 30 110 A 70 70 0 0 1 170 110" fill="none" stroke="#1e293b" stroke-width="6"/>

    <!-- Left Earcup -->
    <g transform="translate(0, 100)">
      <rect x="0" y="0" width="36" height="70" rx="18" fill="url(#headmat)" stroke="#7f5af0" stroke-width="2.5"/>
      <rect x="12" y="10" width="20" height="50" rx="10" fill="#07090e" stroke="#00f2fe" stroke-width="1.5"/>
    </g>

    <!-- Right Earcup -->
    <g transform="translate(164, 100)">
      <rect x="0" y="0" width="36" height="70" rx="18" fill="url(#headmat)" stroke="#7f5af0" stroke-width="2.5"/>
      <rect x="4" y="10" width="20" height="50" rx="10" fill="#07090e" stroke="#00f2fe" stroke-width="1.5"/>
    </g>
  </g>
</svg>
