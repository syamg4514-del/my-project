<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="mountBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanRing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#00b8a9"/>
    </linearGradient>
    <filter id="glowM">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#bgGradM)"/>
  <circle cx="200" cy="150" r="110" fill="#00f2fe" opacity="0.08" filter="url(#glowM)"/>

  <!-- Magnetic Car Vent Mount -->
  <g transform="translate(135, 60)">
    <!-- Back Air Vent Clip Pin -->
    <rect x="50" y="140" width="30" height="45" rx="6" fill="#334155" stroke="#64748b" stroke-width="1.5"/>

    <!-- Main Circular Magnetic Head -->
    <circle cx="65" cy="80" r="65" fill="url(#mountBody)" stroke="url(#cyanRing)" stroke-width="3.5" filter="url(#glowM)"/>
    <circle cx="65" cy="80" r="46" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-dasharray="6 4"/>
    <circle cx="65" cy="80" r="10" fill="#00f2fe"/>
  </g>
</svg>
