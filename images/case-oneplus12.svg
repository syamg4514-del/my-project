<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1P" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190924"/>
      <stop offset="100%" stop-color="#2a0845"/>
    </linearGradient>
    <linearGradient id="oneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4b2b"/>
      <stop offset="100%" stop-color="#ff416c"/>
    </linearGradient>
    <filter id="glow1P">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#bgGrad1P)"/>
  <circle cx="200" cy="150" r="110" fill="#ff4b2b" opacity="0.08" filter="url(#glow1P)"/>

  <!-- OnePlus 12 Case with Circular Hasselblad Camera Dial -->
  <g transform="translate(130, 30)">
    <rect x="0" y="0" width="140" height="240" rx="26" fill="url(#oneBody)" stroke="url(#redGlow)" stroke-width="3.5" filter="url(#glow1P)"/>
    <rect x="8" y="8" width="124" height="224" rx="20" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>
    
    <!-- Circular Camera Module -->
    <circle cx="50" cy="65" r="34" fill="#0b0f19" stroke="#ff4b2b" stroke-width="2"/>
    <circle cx="38" cy="55" r="8" fill="#1e293b" stroke="#ff416c" stroke-width="1.5"/>
    <circle cx="62" cy="55" r="8" fill="#1e293b" stroke="#ff416c" stroke-width="1.5"/>
    <circle cx="38" cy="75" r="8" fill="#1e293b" stroke="#ff416c" stroke-width="1.5"/>
    <circle cx="62" cy="75" r="8" fill="#1e293b" stroke="#ff416c" stroke-width="1.5"/>
    <text x="44" y="68" fill="#ff4b2b" font-family="sans-serif" font-size="8" font-weight="bold">H</text>
  </g>
</svg>
