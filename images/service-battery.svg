<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="batteryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#bgGrad)" />

  <!-- Battery Graphic -->
  <g transform="translate(110, 60)">
    <rect x="0" y="20" width="160" height="100" rx="16" fill="#090d16" stroke="#10b981" stroke-width="3.5" />
    <path d="M160 50 h12 a6 6 0 0 1 6 6 v28 a6 6 0 0 1 -6 6 h-12" fill="#10b981" />
    
    <!-- Charge Cells -->
    <rect x="14" y="34" width="38" height="72" rx="6" fill="url(#batteryGrad)" />
    <rect x="60" y="34" width="38" height="72" rx="6" fill="url(#batteryGrad)" />
    <rect x="106" y="34" width="38" height="72" rx="6" fill="url(#batteryGrad)" />
    
    <!-- Lightning bolt -->
    <path d="M85 30 L65 75 H85 L75 110 L105 60 H85 Z" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Service Title Badge -->
  <rect x="30" y="235" width="340" height="42" rx="10" fill="rgba(15,23,42,0.85)" stroke="rgba(16,185,129,0.4)" />
  <text x="200" y="261" font-family="sans-serif" font-weight="700" font-size="15" fill="#ffffff" text-anchor="middle">🔋 Original Battery &amp; Charging Repair</text>
</svg>
