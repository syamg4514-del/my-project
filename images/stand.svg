<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="standGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow6">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#bgGrad6)"/>
  <circle cx="200" cy="150" r="110" fill="#00f2fe" opacity="0.06" filter="url(#glow6)"/>

  <!-- Aluminum Base -->
  <g transform="translate(110, 60)">
    <ellipse cx="90" cy="190" rx="80" ry="20" fill="url(#standGrad)" stroke="#00f2fe" stroke-width="2" filter="url(#glow6)"/>
    <path d="M 75 180 L 60 70 L 90 70 L 105 180 Z" fill="url(#standGrad)" stroke="#00f2fe" stroke-width="1.5"/>
    <circle cx="75" cy="70" r="10" fill="#00f2fe"/>
    
    <!-- Phone Cradle Backplate -->
    <rect x="25" y="10" width="100" height="110" rx="16" fill="#0f172a" stroke="#00f2fe" stroke-width="2" transform="rotate(-15, 75, 65)"/>
    <path d="M 20 100 L 40 100 L 40 120 L 20 120 Z" fill="#00f2fe"/>
    <path d="M 110 100 L 130 100 L 130 120 L 110 120 Z" fill="#00f2fe"/>
  </g>
</svg>
