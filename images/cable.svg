<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#171e2e"/>
    </linearGradient>
    <linearGradient id="cableGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#7f5af0"/>
    </linearGradient>
    <filter id="glow5">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#bgGrad5)"/>
  <circle cx="200" cy="150" r="110" fill="#4facfe" opacity="0.08" filter="url(#glow5)"/>

  <!-- Curved Braided Cable Loop -->
  <path d="M 60 160 C 140 40, 260 260, 340 140" stroke="url(#cableGrad)" stroke-width="12" fill="none" stroke-linecap="round" filter="url(#glow5)"/>
  <path d="M 60 160 C 140 40, 260 260, 340 140" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-dasharray="3 3" fill="none" stroke-linecap="round"/>

  <!-- Left Connector Head -->
  <g transform="translate(30, 142)">
    <rect x="0" y="0" width="35" height="36" rx="8" fill="#1e293b" stroke="#00f2fe" stroke-width="2"/>
    <rect x="-15" y="10" width="15" height="16" rx="4" fill="#00f2fe"/>
    <rect x="25" y="8" width="10" height="20" rx="3" fill="#00b8a9"/>
  </g>

  <!-- Right Connector Head -->
  <g transform="translate(330, 122)">
    <rect x="0" y="0" width="35" height="36" rx="8" fill="#1e293b" stroke="#7f5af0" stroke-width="2"/>
    <rect x="35" y="10" width="15" height="16" rx="4" fill="#7f5af0"/>
    <rect x="0" y="8" width="10" height="20" rx="3" fill="#4facfe"/>
  </g>
</svg>
